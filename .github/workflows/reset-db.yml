name: 🗑️ Reset banco de usuários (teste)

on:
  workflow_dispatch:

jobs:
  reset-instancia-1:
    name: Reset DB instância 1 (SSH)
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            echo '{}' > ~/security-multicloud-scanner/users_db.json
            echo '{}' > ~/security-multicloud-scanner/sessions_db.json
            echo "✅ DB resetado na instância 1"

  reset-instancia-2:
    name: Reset DB instância 2 (SSM)
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Reset via SSM
        run: |
          aws ssm send-command \
            --instance-ids i-0d229984fa69cc430 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["echo {} > /home/ubuntu/security-scanner/users_db.json && echo {} > /home/ubuntu/security-scanner/sessions_db.json && echo DB resetado na instancia 2"]' \
            --region us-east-2
          echo "✅ Comando enviado para instância 2"
