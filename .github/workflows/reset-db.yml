name: Reset banco de usuários

on:
  workflow_dispatch:

jobs:
  reset-instancia-1:
    name: Reset DB instância 1 (SSM — security-scanner-green)
    runs-on: ubuntu-latest
    steps:
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b  # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Reset via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0ce809776e285c1b2 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "printf \"{}\" > /home/ubuntu/security-multicloud-scanner/users_db.json",
              "printf \"{}\" > /home/ubuntu/security-multicloud-scanner/sessions_db.json",
              "echo RESET_OK",
              "cat /home/ubuntu/security-multicloud-scanner/users_db.json"
            ]' \
            --region us-east-2 \
            --query 'Command.CommandId' \
            --output text)

          echo "Command ID: $COMMAND_ID"
          sleep 15
          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id i-0ce809776e285c1b2 \
            --region us-east-2 \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output text
          echo "✅ Reset instância 1 concluído"

  reset-instancia-2:
    name: Reset DB instância 2 (SSM — security-scanner-instance)
    runs-on: ubuntu-latest
    steps:
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b  # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Reset via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-01d5f2a3614e7d4a7 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "printf \"{}\" > /home/ubuntu/security-scanner/users_db.json",
              "printf \"{}\" > /home/ubuntu/security-scanner/sessions_db.json",
              "echo RESET_OK",
              "cat /home/ubuntu/security-scanner/users_db.json"
            ]' \
            --region us-east-2 \
            --query 'Command.CommandId' \
            --output text)

          echo "Command ID: $COMMAND_ID"
          sleep 15
          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id i-01d5f2a3614e7d4a7 \
            --region us-east-2 \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output text
          echo "✅ Reset instância 2 concluído"
