name: Reset banco de usuários

on:
  workflow_dispatch:

jobs:
  reset-all-instances:
    name: Reset DB — todas as instâncias (ASG dinâmico)
    runs-on: ubuntu-latest
    steps:
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b  # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Reset via SSM em todas as instâncias do ASG
        run: |
          set -euo pipefail

          REGION="us-east-2"
          # Descobre instâncias healthy apenas do ASG principal
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --region "$REGION" \
            --auto-scaling-group-names "security-scanner-asg" \
            --query "AutoScalingGroups[].Instances[?HealthStatus=='Healthy'].InstanceId" \
            --output text | tr '\t' ' ')

          echo "Instâncias encontradas: $INSTANCE_IDS"

          if [ -z "$INSTANCE_IDS" ]; then
            echo "❌ Nenhuma instância encontrada no ASG"
            exit 1
          fi

          # Zera S3 e arquivos locais via SSM (instâncias têm IAM role com acesso ao S3)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "printf \"{}\" > /home/ubuntu/security-scanner/users_db.json",
              "printf \"{}\" > /home/ubuntu/security-scanner/sessions_db.json",
              "aws s3 cp /home/ubuntu/security-scanner/users_db.json    s3://security-scanner-db-442042548551/db/users_db.json    --region us-east-2",
              "aws s3 cp /home/ubuntu/security-scanner/sessions_db.json s3://security-scanner-db-442042548551/db/sessions_db.json --region us-east-2",
              "sudo systemctl restart security-scanner || pkill -f uvicorn || true",
              "echo RESET_OK"
            ]' \
            --region "$REGION" \
            --query 'Command.CommandId' \
            --output text)

          echo "Command ID: $COMMAND_ID"

          # Aguarda e verifica resultado em cada instância
          FAILED=0
          for ID in $INSTANCE_IDS; do
            for i in $(seq 1 12); do
              sleep 5
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$ID" \
                --region "$REGION" \
                --query 'Status' --output text 2>/dev/null || echo "Pending")

              case "$STATUS" in
                Success)
                  echo "✅ $ID — reset concluído"
                  break
                  ;;
                Failed|Cancelled|TimedOut|DeliveryTimedOut)
                  echo "❌ $ID — falhou (Status: $STATUS)"
                  FAILED=1
                  break
                  ;;
              esac
            done
          done

          [ $FAILED -eq 0 ] && echo "✅ Todas as instâncias resetadas" || exit 1
