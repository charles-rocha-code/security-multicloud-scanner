name: 🚀 Deploy Automático para AWS

on:
  push:
    branches:
      - main

jobs:
  # ----------------------------------------------------------------
  # Instância 1 — SSH direto (10.0.1.248 / sem systemd)
  # ----------------------------------------------------------------
  deploy-instancia-1:
    name: Deploy instância 1 (SSH)
    runs-on: ubuntu-latest
    steps:
      - name: 🔗 Conectar e atualizar
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          envs: GH_TOKEN
          script: |
            echo "📦 Atualizando código..."
            cd ~/security-multicloud-scanner
            git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/charles-rocha-code/security-multicloud-scanner.git
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            echo "📦 Atualizando dependências..."
            source venv/bin/activate
            pip install -r requirements.txt -q

            echo "🔄 Reiniciando aplicação..."
            fuser -k 8000/tcp || true
            sleep 2
            mkdir -p logs
            nohup python3 -m uvicorn api_with_mfa:app --host 0.0.0.0 --port 8000 > logs/api.log 2>&1 &

            echo "⏳ Aguardando servidor subir..."
            sleep 8
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "✅ Instância 1 OK"
            else
              echo "❌ Instância 1 não respondeu. Log:"
              cat logs/api.log 2>/dev/null
              exit 1
            fi

  # ----------------------------------------------------------------
  # Instância 2 — SSM (10.0.20.212 / com systemd / sem SSH aberto)
  # ----------------------------------------------------------------
  deploy-instancia-2:
    name: Deploy instância 2 (SSM)
    runs-on: ubuntu-latest
    steps:
      - name: 🔗 Atualizar via SSM
        run: |
          aws ssm send-command \
            --instance-id i-0d229984fa69cc430 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ubuntu/security-scanner",
              "git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/charles-rocha-code/security-multicloud-scanner.git",
              "git fetch origin main",
              "git reset --hard origin/main",
              "git clean -fd",
              "source venv/bin/activate && pip install -r requirements.txt -q",
              "sudo systemctl restart security-scanner",
              "sleep 8",
              "curl -sf http://localhost:8000/health && echo OK || echo FAIL"
            ]' \
            --region us-east-2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
