name: Deploy to AWS

on:
  push:
    branches:
      - main

# Prevents two deploys running at the same time
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------
  # Instance 1 — SSH direct (AZ-a)
  # ----------------------------------------------------------------
  deploy-instance-1:
    name: Deploy Instance 1 (SSH)
    runs-on: ubuntu-latest
    steps:
      - name: Connect and update
        # Pinned by commit SHA — prevents supply chain attacks via mutable tags
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262  # v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          port: 22
          script_stop: true
          envs: GH_TOKEN
          script: |
            set -euo pipefail

            APP_DIR=~/security-multicloud-scanner

            echo "--- Updating code ---"
            cd "$APP_DIR"

            # Set remote with token (same as before), then immediately
            # remove it from .git/config after fetch to avoid leaking token
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/charles-rocha-code/security-multicloud-scanner.git"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            # Remove token from remote URL immediately after use
            git remote set-url origin "https://github.com/charles-rocha-code/security-multicloud-scanner.git"

            echo "--- Updating dependencies ---"
            source venv/bin/activate
            pip install -r requirements.txt -q

            echo "--- Restarting application ---"
            # Use systemd if configured, otherwise kill by process name (not port)
            if systemctl is-active --quiet security-scanner 2>/dev/null; then
              sudo systemctl restart security-scanner
            else
              pkill -f "uvicorn api_with_mfa" || true
              sleep 2
              mkdir -p logs
              nohup python3 -m uvicorn api_with_mfa:app \
                --host 127.0.0.1 \
                --port 8000 \
                > logs/api.log 2>&1 &
              disown
            fi

            echo "--- Health check ---"
            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
                echo "✅ Instance 1 healthy (${i}s)"
                exit 0
              fi
              sleep 2
            done

            echo "❌ Instance 1 did not respond after 30s. Last log:"
            tail -30 logs/api.log 2>/dev/null || true
            exit 1

  # ----------------------------------------------------------------
  # Instance 2 — SSM (AZ-b, no SSH exposed)
  # ----------------------------------------------------------------
  deploy-instance-2:
    name: Deploy Instance 2 (SSM)
    runs-on: ubuntu-latest
    needs: deploy-instance-1
    steps:
      - name: Configure AWS credentials
        # Pinned by commit SHA
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4.0.2
        with:
          # TODO: migrate to OIDC to eliminate static keys:
          # role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Deploy via SSM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # TODO: move to secret → secrets.AWS_INSTANCE_2_ID
          INSTANCE_ID="i-0d229984fa69cc430"
          REGION="us-east-2"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 120 \
            --parameters "commands=[\
              \"set -euo pipefail\",\
              \"export HOME=/root\",\
              \"git config --global --add safe.directory /home/ubuntu/security-scanner\",\
              \"cd /home/ubuntu/security-scanner\",\
              \"git remote set-url origin 'https://x-access-token:${GH_TOKEN}@github.com/charles-rocha-code/security-multicloud-scanner.git'\",\
              \"git fetch origin main\",\
              \"git reset --hard origin/main\",\
              \"git clean -fd\",\
              \"git remote set-url origin 'https://github.com/charles-rocha-code/security-multicloud-scanner.git'\",\
              \"chown -R ubuntu:ubuntu /home/ubuntu/security-scanner\",\
              \"sudo -u ubuntu /home/ubuntu/security-scanner/venv/bin/pip install -r /home/ubuntu/security-scanner/requirements.txt -q\",\
              \"sudo systemctl restart security-scanner\",\
              \"sleep 8\",\
              \"curl -sf http://127.0.0.1:8000/health && echo OK\"\
            ]" \
            --region "$REGION" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Poll with timeout instead of fixed sleep
          for i in $(seq 1 20); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "[${i}] Status: $STATUS"

            case "$STATUS" in
              Success)
                echo "✅ Instance 2 deployed successfully"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut)
                echo "❌ Instance 2 failed — Status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$REGION" \
                  --query 'StandardErrorContent' \
                  --output text || true
                exit 1
                ;;
            esac
          done

          echo "❌ Timed out waiting for SSM command"
          exit 1
