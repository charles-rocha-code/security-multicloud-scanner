name: 🚀 Deploy Automático para AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy para Servidor AWS
    runs-on: ubuntu-latest

    steps:
      - name: 🔗 Conectar e atualizar servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            echo "📦 Atualizando código..."
            cd ~/security-multicloud-scanner
            git pull origin main

            echo "📦 Atualizando dependências..."
            source venv/bin/activate
            pip install -r requirements.txt -q

            echo "🔄 Reiniciando aplicação..."
            fuser -k 8000/tcp || true
            sleep 2
            mkdir -p logs
            nohup python3 -m uvicorn api_with_mfa:app --host 0.0.0.0 --port 8000 > logs/api.log 2>&1 &
            APP_PID=$!

            echo "⏳ Aguardando servidor subir..."
            sleep 5
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "✅ Deploy concluído! PID: $APP_PID — servidor respondendo."
            else
              echo "❌ Servidor não respondeu após o deploy. Verifique logs/api.log"
              exit 1
            fi