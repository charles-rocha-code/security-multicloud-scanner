name: Deploy to AWS

on:
  push:
    branches:
      - main

# Prevents two deploys running at the same time
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy — rolling zero-downtime via SSM + ALB draining
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b  # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Rolling deploy via SSM com ALB draining
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REGION="us-east-2"
          APP_DIR="/home/ubuntu/security-scanner"
          ASG_NAME="security-scanner-asg"
          DB_BUCKET="security-scanner-db-442042548551"
          TG_ARNS=(
            "arn:aws:elasticloadbalancing:us-east-2:442042548551:targetgroup/security-scanner-tg/87dec1f4eeb87cc8"
            "arn:aws:elasticloadbalancing:us-east-2:442042548551:targetgroup/security-scanner-tg-green/c45365c904a3218c"
          )

          # Remove do TG qualquer target que não pertença a nenhum ASG (zumbis/instâncias manuais)
          echo "=== Limpando targets órfãos dos TGs ==="
          ALL_ASG_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --region "$REGION" \
            --query "AutoScalingGroups[].Instances[].InstanceId" \
            --output text | tr '\t' '\n')

          for TG_ARN in "${TG_ARNS[@]}"; do
            TG_TARGETS=$(aws elbv2 describe-target-health \
              --target-group-arn "$TG_ARN" \
              --region "$REGION" \
              --query "TargetHealthDescriptions[].Target.Id" \
              --output text | tr '\t' '\n')
            for TARGET_ID in $TG_TARGETS; do
              if ! echo "$ALL_ASG_IDS" | grep -q "$TARGET_ID"; then
                echo "⚠️  $TARGET_ID não pertence a nenhum ASG — removendo do TG"
                aws elbv2 deregister-targets \
                  --target-group-arn "$TG_ARN" \
                  --targets Id="$TARGET_ID" \
                  --region "$REGION" || true
              fi
            done
          done
          echo "✅ Limpeza de targets órfãos concluída"

          # Descobre instâncias healthy do ASG em estado running (exclui bootstrapping/terminating)
          ALL_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --region "$REGION" \
            --auto-scaling-group-names "$ASG_NAME" \
            --query "AutoScalingGroups[].Instances[?HealthStatus=='Healthy'].InstanceId" \
            --output text | tr '\t' ' ')

          INSTANCE_IDS=""
          for ID in $ALL_IDS; do
            STATE=$(aws ec2 describe-instances \
              --instance-ids "$ID" --region "$REGION" \
              --query "Reservations[0].Instances[0].State.Name" \
              --output text 2>/dev/null || echo "unknown")
            if [ "$STATE" = "running" ]; then
              INSTANCE_IDS="$INSTANCE_IDS $ID"
            else
              echo "⚠️ Ignorando $ID — estado: $STATE"
            fi
          done
          INSTANCE_IDS=$(echo $INSTANCE_IDS | xargs)

          echo "Instâncias encontradas: $INSTANCE_IDS"
          TOTAL=$(echo $INSTANCE_IDS | wc -w)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "❌ Nenhuma instância encontrada no ASG"
            exit 1
          fi

          if [ "$TOTAL" -lt 2 ]; then
            echo "⚠️  Apenas $TOTAL instância — deploy sem draining para evitar downtime total"
          fi

          FAILED=0

          for INSTANCE_ID in $INSTANCE_IDS; do
            echo ""
            echo "=== Deployando em $INSTANCE_ID ==="

            # Rastreia quais TGs tinham esta instância ANTES de deregistrar
            REGISTERED_TGS=()

            if [ "$TOTAL" -gt 1 ]; then
              for TG_ARN in "${TG_ARNS[@]}"; do
                REGISTERED=$(aws elbv2 describe-target-health \
                  --target-group-arn "$TG_ARN" \
                  --region "$REGION" \
                  --query "TargetHealthDescriptions[?Target.Id=='$INSTANCE_ID'].Target.Id" \
                  --output text 2>/dev/null || echo "")

                if [ -n "$REGISTERED" ]; then
                  REGISTERED_TGS+=("$TG_ARN")
                  echo "Deregistrando $INSTANCE_ID do ALB ($TG_ARN)..."
                  aws elbv2 deregister-targets \
                    --target-group-arn "$TG_ARN" \
                    --targets Id="$INSTANCE_ID" \
                    --region "$REGION"

                  # Aguarda draining (até 45s)
                  for d in $(seq 1 9); do
                    sleep 5
                    STATE=$(aws elbv2 describe-target-health \
                      --target-group-arn "$TG_ARN" \
                      --targets Id="$INSTANCE_ID" \
                      --region "$REGION" \
                      --query "TargetHealthDescriptions[0].TargetHealth.State" \
                      --output text 2>/dev/null || echo "unused")
                    echo "  Draining [$d] — State: $STATE"
                    [ "$STATE" = "unused" ] || [ "$STATE" = "None" ] && break
                  done
                  echo "✅ Draining concluído"
                fi
              done
            fi

            # Verifica estado da instância antes de enviar SSM (pode ter sido terminada pelo ASG durante o deploy anterior)
            PRE_SSM_STATE=$(aws ec2 describe-instances \
              --instance-ids "$INSTANCE_ID" \
              --region "$REGION" \
              --query "Reservations[0].Instances[0].State.Name" \
              --output text 2>/dev/null || echo "unknown")
            if [ "$PRE_SSM_STATE" != "running" ]; then
              echo "⚠️ $INSTANCE_ID não está running ($PRE_SSM_STATE) antes do SSM — ignorando (ASG substituirá a instância)"
              continue
            fi

            # Aguarda SSM Agent ficar Online (nova instância pode demorar até 3 min para registrar)
            SSM_READY=0
            for ssm_attempt in $(seq 1 12); do
              SSM_PING=$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                --region "$REGION" \
                --query "InstanceInformationList[0].PingStatus" \
                --output text 2>/dev/null || echo "none")
              echo "  SSM ping [$ssm_attempt/12]: $SSM_PING"
              if [ "$SSM_PING" = "Online" ]; then
                SSM_READY=1
                break
              fi
              sleep 15
            done
            if [ "$SSM_READY" -eq 0 ]; then
              echo "❌ SSM Agent não ficou Online em $INSTANCE_ID — pulando instância"
              FAILED=1
              continue
            fi

            # Deploy via SSM
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --timeout-seconds 420 \
              --parameters "commands=[\
                \"set -eu\",\
                \"export HOME=/root\",\
                \"if [ ! -f /swapfile ]; then fallocate -l 1G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo 'Swap 1G ativado'; else echo 'Swap ja existe'; fi\",\
                \"if [ ! -d $APP_DIR ]; then echo 'SKIP - app nao instalado'; exit 0; fi\",\
                \"git config --global --add safe.directory $APP_DIR\",\
                \"cd $APP_DIR\",\
                \"git remote set-url origin 'https://x-access-token:${GH_TOKEN}@github.com/charles-rocha-code/security-multicloud-scanner.git'\",\
                \"git fetch origin main\",\
                \"git reset --hard origin/main\",\
                \"git clean -fd\",\
                \"git remote set-url origin 'https://github.com/charles-rocha-code/security-multicloud-scanner.git'\",\
                \"chown -R ubuntu:ubuntu $APP_DIR\",\
                \"sudo -u ubuntu $APP_DIR/venv/bin/pip install -r $APP_DIR/requirements.txt -q\",\
                \"aws ssm get-parameter --name /security-scanner/ANTHROPIC_API_KEY --with-decryption --region us-east-2 --query Parameter.Value --output text > /tmp/ak_tmp.txt\",\
                \"printf 'ANTHROPIC_API_KEY=' > $APP_DIR/.env && tr -d '\\n' < /tmp/ak_tmp.txt >> $APP_DIR/.env && echo >> $APP_DIR/.env && rm -f /tmp/ak_tmp.txt\",\
                \"chmod 600 $APP_DIR/.env && chown ubuntu:ubuntu $APP_DIR/.env\",\
                \"cp $APP_DIR/.deploy/security-scanner.service /etc/systemd/system/security-scanner.service\",\
                \"systemctl daemon-reload && echo 'Service file atualizado'\",\
                \"aws s3 cp s3://$DB_BUCKET/db/users_db.json $APP_DIR/users_db.json 2>/dev/null || echo 'AVISO: users_db nao encontrado no S3'\",\
                \"aws s3 cp s3://$DB_BUCKET/db/sessions_db.json $APP_DIR/sessions_db.json 2>/dev/null || echo 'AVISO: sessions_db nao encontrado no S3'\",\
                \"chown ubuntu:ubuntu $APP_DIR/users_db.json $APP_DIR/sessions_db.json 2>/dev/null || true\",\
                \"sudo -u ubuntu $APP_DIR/venv/bin/python $APP_DIR/cve_updater.py >> /var/log/cve_updater.log 2>&1 & echo 'cve_updater iniciado em background'\",\
                \"crontab -u ubuntu -l 2>/dev/null | grep -v cve_updater > /tmp/.cron_cveu 2>/dev/null || true; echo '0 3 * * 1 cd $APP_DIR && $APP_DIR/venv/bin/python $APP_DIR/cve_updater.py >> /var/log/cve_updater.log 2>&1' >> /tmp/.cron_cveu; crontab -u ubuntu /tmp/.cron_cveu && rm -f /tmp/.cron_cveu && echo 'cron cve_updater configurado'\",\
                \"sudo systemctl restart security-scanner\",\
                \"sleep 5 && curl -sf --retry 11 --retry-delay 5 --retry-connrefused http://127.0.0.1:8000/health && echo HEALTH_OK || { journalctl -u security-scanner -n 40 --no-pager 2>/dev/null || true; exit 1; }\"\
              ]" \
              --region "$REGION" \
              --query 'Command.CommandId' \
              --output text)

            echo "SSM Command ID: $COMMAND_ID"

            STATUS="Pending"
            for i in $(seq 1 72); do
              sleep 5
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$REGION" \
                --query 'Status' \
                --output text 2>/dev/null || echo "Pending")
              echo "[${i}] $INSTANCE_ID — Status: $STATUS"
              case "$STATUS" in
                Success) echo "✅ $INSTANCE_ID — deploy concluído"; break ;;
                Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut)
                  echo "❌ $INSTANCE_ID — falhou"
                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                    --region "$REGION" --query 'StandardErrorContent' --output text || true
                  FAILED=1; break ;;
              esac
            done

            [ "$STATUS" = "Success" ] || { echo "❌ Timeout em $INSTANCE_ID"; FAILED=1; }

            # Re-registra no ALB apenas se instância ainda está em running
            if [ "${#REGISTERED_TGS[@]}" -gt 0 ]; then
              INST_STATE=$(aws ec2 describe-instances \
                --instance-ids "$INSTANCE_ID" \
                --region "$REGION" \
                --query "Reservations[0].Instances[0].State.Name" \
                --output text 2>/dev/null || echo "unknown")
              echo "Estado EC2 de $INSTANCE_ID: $INST_STATE"

              if [ "$INST_STATE" != "running" ]; then
                echo "⚠️ $INSTANCE_ID não está running ($INST_STATE) — pulando re-registro no ALB"
              else
              for TG_ARN in "${REGISTERED_TGS[@]}"; do
                echo "Re-registrando $INSTANCE_ID em $TG_ARN..."
                aws elbv2 register-targets \
                  --target-group-arn "$TG_ARN" \
                  --targets Id="$INSTANCE_ID" \
                  --region "$REGION" || true

                # Aguarda healthy apenas se o deploy teve sucesso
                if [ "$STATUS" = "Success" ]; then
                  ALB_HEALTHY=0
                  for h in $(seq 1 12); do
                    sleep 5
                    STATE=$(aws elbv2 describe-target-health \
                      --target-group-arn "$TG_ARN" \
                      --targets Id="$INSTANCE_ID" \
                      --region "$REGION" \
                      --query "TargetHealthDescriptions[0].TargetHealth.State" \
                      --output text 2>/dev/null || echo "unknown")
                    echo "  ALB health [$h] — State: $STATE"
                    if [ "$STATE" = "healthy" ]; then ALB_HEALTHY=1; break; fi
                  done
                  if [ "$ALB_HEALTHY" -eq 0 ]; then
                    echo "❌ $INSTANCE_ID não ficou healthy no ALB dentro do timeout — marcando deploy como FAILED"
                    FAILED=1
                  fi
                fi
              done
              echo "✅ $INSTANCE_ID re-registrado no ALB"
              fi  # fim do check running
            fi
          done

          [ $FAILED -eq 0 ] && echo "" && echo "✅ Deploy concluído em todas as instâncias" || exit 1
