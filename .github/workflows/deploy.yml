name: 🚀 Deploy Automático para AWS

on:
  push:
    branches:
      - main

jobs:
  # ----------------------------------------------------------------
  # Instância 1 — SSH direto (10.0.1.248 / sem systemd)
  # ----------------------------------------------------------------
  deploy-instancia-1:
    name: Deploy instância 1 (SSH)
    runs-on: ubuntu-latest
    steps:
      - name: 🔗 Conectar e atualizar
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          envs: GH_TOKEN
          script: |
            echo "📦 Atualizando código..."
            cd ~/security-multicloud-scanner
            git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/charles-rocha-code/security-multicloud-scanner.git
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            echo "📦 Atualizando dependências..."
            source venv/bin/activate
            pip install -r requirements.txt -q

            echo "🔄 Reiniciando aplicação..."
            fuser -k 8000/tcp || true
            sleep 2
            mkdir -p logs
            nohup python3 -m uvicorn api_with_mfa:app --host 0.0.0.0 --port 8000 > logs/api.log 2>&1 &

            echo "⏳ Aguardando servidor subir..."
            sleep 8
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "✅ Instância 1 OK"
            else
              echo "❌ Instância 1 não respondeu. Log:"
              cat logs/api.log 2>/dev/null
              exit 1
            fi

  # ----------------------------------------------------------------
  # Instância 2 — SSM (10.0.20.212 / sem SSH aberto)
  # ----------------------------------------------------------------
  deploy-instancia-2:
    name: Deploy Instância 2 (SSM)
    runs-on: ubuntu-latest
    needs: deploy-instancia-1
    steps:
      - name: 🔑 Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: 🚀 Executar deploy via SSM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0d229984fa69cc430 \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"export HOME=/root && git config --global --add safe.directory /home/ubuntu/security-scanner && cd /home/ubuntu/security-scanner && git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/charles-rocha-code/security-multicloud-scanner.git && git fetch origin main && git reset --hard origin/main && git clean -fd && chown -R ubuntu:ubuntu /home/ubuntu/security-scanner && sudo -u ubuntu /home/ubuntu/security-scanner/venv/bin/pip install -r /home/ubuntu/security-scanner/requirements.txt -q && sudo systemctl restart security-scanner && sleep 8 && curl -sf http://localhost:8000/health && echo OK\"]" \
            --region us-east-2 \
            --query 'Command.CommandId' \
            --output text)

          echo "Command ID: $COMMAND_ID"
          sleep 30

          STATUS=$(aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id i-0d229984fa69cc430 \
            --region us-east-2 \
            --query 'Status' \
            --output text)

          echo "Status: $STATUS"

          if [ "$STATUS" = "Success" ]; then
            echo "✅ Instância 2 atualizada com sucesso"
          else
            echo "❌ Instância 2 falhou"
            aws ssm get-command-invocation \
              --command-id $COMMAND_ID \
              --instance-id i-0d229984fa69cc430 \
              --region us-east-2 \
              --query 'StandardErrorContent' \
              --output text
            exit 1
          fi
