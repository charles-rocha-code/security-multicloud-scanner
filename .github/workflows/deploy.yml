name: 🚀 Deploy Automático para AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy para Servidor AWS
    runs-on: ubuntu-latest

    steps:
      - name: 🔗 Conectar e atualizar servidor
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          envs: GH_TOKEN
          script: |
            echo "📦 Atualizando código..."
            cd ~/security-multicloud-scanner
            git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/charles-rocha-code/security-multicloud-scanner.git
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            echo "📦 Atualizando dependências..."
            source venv/bin/activate
            pip install -r requirements.txt -q

            echo "🔄 Reiniciando aplicação..."
            sudo systemctl restart security-scanner

            echo "⏳ Aguardando servidor subir..."
            sleep 8
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "✅ Deploy concluído! Serviço reiniciado e servidor respondendo."
            else
              echo "❌ Servidor não respondeu. Log de inicialização:"
              sudo journalctl -u security-scanner --no-pager -n 50
              exit 1
            fi