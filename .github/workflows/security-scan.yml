name: Security Scan (SAST + Secrets)

# Fase 1 de docs/sast-dast-roadmap.md. Separado de test.yml/code-review.yml
# de propósito (mesma filosofia de gates com objetivos diferentes já usada
# no resto da esteira -- ver comentário em test.yml). Non-blocking por
# enquanto: primeira rodada dos dois scanners contra um código que nunca
# foi escaneado por eles antes, achado legado esperado (dead code como
# api.py, api_backup.py) -- promover pra bloqueante depois de um período de
# baseline "verde" é feito via branch protection (Settings -> Branches),
# não por mudança neste arquivo.
#
# CLI direto (pip install / imagem oficial) em vez de Marketplace Action de
# terceiro -- evita mais um pin de SHA de action externa pra confiar, sem
# perder cobertura (mesmas ferramentas, mesmas regras).
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.12"

      - name: Instala Semgrep
        run: pip install semgrep

      - name: Roda Semgrep (regras Python + secrets + auditoria de segurança)
        run: |
          semgrep scan \
            --config=p/python \
            --config=p/secrets \
            --config=p/security-audit \
            --exclude=venv \
            --exclude=docs \
            --metrics=off

  gitleaks:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout (histórico completo -- gitleaks escaneia commits antigos também)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - name: Roda Gitleaks (imagem oficial, pinada por versão)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --no-git=false -v
