[pytest]
# Restringe a coleta a tests/ -- sem isso, o pytest tentaria coletar
# test_graph_local.py (script manual de smoke test, não um teste de
# verdade: levanta SystemExit se as tabelas -dev não estiverem configuradas
# no ambiente, o que aborta a suíte inteira, não só ele). Isolar por
# diretório resolve isso sem precisar renomear/mover o script existente.
testpaths = tests
# tests/ não tem __init__.py (de propósito -- mais simples), então o pytest
# não infere a raiz do projeto sozinho. Sem isso, "import auth_mfa" etc.
# (módulos na raiz do repo) falha com ModuleNotFoundError.
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
