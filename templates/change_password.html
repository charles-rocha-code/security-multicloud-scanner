<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Trocar Senha - Security Scanner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #0e1117 0%, #1a1d29 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #1e2139;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      padding: 48px;
      max-width: 460px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header-icon {
      font-size: 56px;
      margin-bottom: 16px;
    }

    h1 {
      color: #ffffff;
      font-size: 26px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #8b92a7;
      font-size: 14px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #e1e4ea;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: #2a2e45;
      border: 2px solid #3a3f5c;
      border-radius: 8px;
      color: #ffffff;
      font-size: 15px;
      transition: all 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #5b7cff;
      background: #33384f;
    }

    input#mfa_code {
      font-weight: 600;
      letter-spacing: 4px;
      text-align: center;
    }

    input::placeholder {
      color: #6b7280;
      letter-spacing: normal;
    }

    .hint {
      color: #6b7280;
      font-size: 12px;
      margin-top: 6px;
      line-height: 1.5;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #5b7cff 0%, #4c63d9 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(91, 124, 255, 0.4);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      background: #4a5568;
      cursor: not-allowed;
      transform: none;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.5;
    }

    .alert-success {
      background: #065f46;
      color: #d1fae5;
      border-left: 4px solid #10b981;
    }

    .alert-error {
      background: #7f1d1d;
      color: #fee2e2;
      border-left: 4px solid #ef4444;
    }

    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .back-link {
      text-align: center;
      margin-top: 24px;
    }

    .back-link a {
      color: #5b7cff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-icon">🔑</div>
      <h1>Trocar Senha</h1>
      <p class="subtitle">Exige sua senha atual e um código do seu app de autenticação</p>
    </div>

    <div id="alert-container"></div>

    <form id="change-form">
      <div class="form-group">
        <label for="current_password">Senha atual</label>
        <input id="current_password" type="password" autocomplete="current-password" required />
      </div>

      <div class="form-group">
        <label for="new_password">Nova senha</label>
        <input id="new_password" type="password" autocomplete="new-password" minlength="12" required />
        <div class="hint">Mínimo de 12 caracteres. Evite senhas óbvias ou que contenham seu email.</div>
      </div>

      <div class="form-group">
        <label for="new_password_confirm">Confirme a nova senha</label>
        <input id="new_password_confirm" type="password" autocomplete="new-password" minlength="12" required />
      </div>

      <div class="form-group">
        <label for="mfa_code">Código MFA (6 dígitos ou backup code)</label>
        <input id="mfa_code" type="text" maxlength="64" placeholder="000000" autocomplete="off" required />
      </div>

      <button type="submit" class="btn" id="btn">Trocar senha</button>
    </form>

    <div class="back-link">
      <a href="/dashboard">← Voltar para o Dashboard</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('change-form');
    const btn = document.getElementById('btn');
    const alertContainer = document.getElementById('alert-container');

    function showAlert(message, type = 'error') {
      alertContainer.innerHTML = '';
      const alert = document.createElement('div');
      alert.className = `alert alert-${type}`;
      alert.textContent = message;
      alertContainer.appendChild(alert);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const current_password = document.getElementById('current_password').value;
      const new_password = document.getElementById('new_password').value;
      const new_password_confirm = document.getElementById('new_password_confirm').value;
      const mfa_code = document.getElementById('mfa_code').value.trim();

      if (new_password !== new_password_confirm) {
        showAlert('❌ As senhas novas não coincidem.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span>Trocando...';

      try {
        const res = await fetch('/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ current_password, new_password, mfa_code }),
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          let detail = data.detail || 'Erro ao trocar a senha.';
          if (Array.isArray(detail)) {
            detail = detail.map(d => d.msg).join(' ');
          }
          showAlert(`❌ ${detail}`);
          btn.disabled = false;
          btn.innerHTML = 'Trocar senha';
          return;
        }

        showAlert('✅ Senha alterada com sucesso! Redirecionando para o login...', 'success');
        setTimeout(() => {
          window.location.href = '/login';
        }, 2000);

      } catch (error) {
        showAlert('❌ Erro ao conectar com o servidor.');
        btn.disabled = false;
        btn.innerHTML = 'Trocar senha';
      }
    });
  </script>
</body>
</html>
