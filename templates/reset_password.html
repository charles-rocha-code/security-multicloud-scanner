<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Redefinir Senha - Security Scanner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #0e1117 0%, #1a1d29 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #1e2139;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      padding: 48px;
      max-width: 460px;
      width: 100%;
    }

    .header { text-align: center; margin-bottom: 32px; }
    .header-icon { font-size: 56px; margin-bottom: 16px; }

    h1 { color: #ffffff; font-size: 26px; margin-bottom: 8px; }
    .subtitle { color: #8b92a7; font-size: 14px; line-height: 1.6; }

    .form-group { margin-bottom: 20px; }

    label {
      display: block;
      color: #e1e4ea;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: #2a2e45;
      border: 2px solid #3a3f5c;
      border-radius: 8px;
      color: #ffffff;
      font-size: 15px;
      transition: all 0.3s;
    }

    input:focus { outline: none; border-color: #5b7cff; background: #33384f; }

    .hint { color: #6b7280; font-size: 12px; margin-top: 6px; line-height: 1.5; }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #5b7cff 0%, #4c63d9 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(91, 124, 255, 0.4); }
    .btn:disabled { background: #4a5568; cursor: not-allowed; transform: none; }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.5;
    }

    .alert-success { background: #065f46; color: #d1fae5; border-left: 4px solid #10b981; }
    .alert-error { background: #7f1d1d; color: #fee2e2; border-left: 4px solid #ef4444; }

    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .back-link { text-align: center; margin-top: 24px; }
    .back-link a { color: #5b7cff; text-decoration: none; font-size: 14px; font-weight: 600; }
    .back-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-icon">🔑</div>
      <h1>Redefinir Senha</h1>
      <p class="subtitle">Escolha uma nova senha para sua conta</p>
    </div>

    <div id="alert-container"></div>

    <form id="reset-form">
      <div class="form-group">
        <label for="new_password">Nova senha</label>
        <input id="new_password" type="password" autocomplete="new-password" minlength="12" required />
        <div class="hint">Mínimo de 12 caracteres. Evite senhas óbvias ou que contenham seu email.</div>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirme a nova senha</label>
        <input id="confirm_password" type="password" autocomplete="new-password" minlength="12" required />
      </div>

      <button type="submit" class="btn" id="btn">Redefinir senha</button>
    </form>

    <div class="back-link">
      <a href="/login">← Voltar para Login</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';

    const form = document.getElementById('reset-form');
    const btn = document.getElementById('btn');
    const alertContainer = document.getElementById('alert-container');

    function showAlert(message, type = 'error') {
      alertContainer.innerHTML = '';
      const alert = document.createElement('div');
      alert.className = `alert alert-${type}`;
      alert.textContent = message;
      alertContainer.appendChild(alert);
    }

    if (!token) {
      showAlert('❌ Link inválido — faltando o token de redefinição. Solicite um novo link.');
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const new_password = document.getElementById('new_password').value;
      const confirm_password = document.getElementById('confirm_password').value;

      if (new_password !== confirm_password) {
        showAlert('❌ As senhas não coincidem.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span>Redefinindo...';

      try {
        const res = await fetch('/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password }),
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          let detail = data.detail || 'Erro ao redefinir a senha.';
          if (Array.isArray(detail)) {
            detail = detail.map(d => d.msg).join(' ');
          }
          showAlert(`❌ ${detail}`);
          btn.disabled = false;
          btn.innerHTML = 'Redefinir senha';
          return;
        }

        showAlert('✅ Senha redefinida com sucesso! Redirecionando para o login...', 'success');
        form.style.display = 'none';
        setTimeout(() => { window.location.href = '/login'; }, 2000);

      } catch (error) {
        showAlert('❌ Erro ao conectar com o servidor.');
        btn.disabled = false;
        btn.innerHTML = 'Redefinir senha';
      }
    });
  </script>
</body>
</html>
